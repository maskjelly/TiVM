name: tivm

services:
  desktop:
    build:
      context: ./docker
    image: tivm-desktop:latest
    container_name: tivm-desktop
    restart: unless-stopped
    env_file: .env
    environment:
      SCREEN_W: ${SCREEN_W:-1280}
      SCREEN_H: ${SCREEN_H:-800}
      DISPLAY: ":99"
    ports:
      - "${TIVM_BIND:-0.0.0.0}:6080:6080"
      - "${TIVM_BIND:-0.0.0.0}:6081:6081"
    volumes:
      - ./agent:/app/agent:ro
      - ./tests:/app/tests:ro
      - ./runs:/app/runs
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    shm_size: "512mb"
