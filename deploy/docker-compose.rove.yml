# rove-specific overrides.
#
# rove runs kernel 5.4; Ubuntu 24.04's glibc/GLib use close_range(2) (kernel 5.9+) when
# spawning children. Docker's default seccomp profile refuses the unknown syscall with
# EPERM, so GLib's g_spawn fails ("Failed to close file descriptor for child process")
# and xfce4-session cannot start xfwm4, the panel, the desktop or Thunar — the desktop
# stays black. Plain fork/exec shells are unaffected, which is why only GLib-based
# processes break.
#
# This drops seccomp for the desktop container until the host kernel is upgraded:
#   apt-get install -y linux-generic-hwe-20.04 && reboot     (kernel 5.15)
# After the reboot, delete this file and redeploy.
services:
  desktop:
    security_opt:
      - seccomp=unconfined
