# rove-specific overrides.
#
# seccomp-tivm.json is Docker's default allow-list profile (moby v28.1.1) with two changes:
#   1. close_range is removed from the allow list,
#   2. the default errno is ENOSYS instead of EPERM.
# Why: rove's host libseccomp is 2.5.1 and does not know close_range (added in libseccomp 2.5.2),
# so Docker silently drops that allow rule and the default action applies. EPERM breaks GLib's
# g_spawn ("Failed to close file descriptor for child process") and therefore xfce4-session cannot
# start xfwm4, the panel, the desktop or Thunar — a black screen. ENOSYS makes GLib fall back to
# its /proc/self/fd path, which works. Upgrade the host to Ubuntu 22.04+ (libseccomp >= 2.5.3) and
# the stock profile can be used again.
services:
  desktop:
    security_opt:
      - seccomp=${TIVM_SECCOMP_PROFILE:-/opt/tivm/deploy/seccomp-tivm.json}

  # Job intake, queue and reporting. Reads the dev box over the compose network and
  # the run artifacts straight from ./runs on the host.
  orchestrator:
    build:
      context: ./orchestrator
    image: tivm-orchestrator:latest
    container_name: tivm-orchestrator
    restart: unless-stopped
    env_file: .env
    environment:
      TIVM_BOX_URL: http://tivm-desktop:6081
      TIVM_RUNS_DIR: /runs
      TIVM_DB: /data/jobs.sqlite
      TIVM_PUBLIC_URL: ${TIVM_PUBLIC_URL:-http://127.0.0.1:6090}
    volumes:
      - ./runs:/runs
      - ./data:/data
    ports:
      - "127.0.0.1:6090:6090"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      - desktop
