<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TiVM</title>
<style>
  :root {
    --bg: #0a0a0a;
    --panel: #0f0f0f;
    --panel-2: #141414;
    --border: #262626;
    --border-2: #383838;
    --text: #e5e5e5;
    --dim: #8a8a8a;
    --faint: #5c5c5c;
    --ok: #4ade80;
    --warn: #fbbf24;
    --err: #f87171;
    --accent: #e5e5e5;
  }
  * { box-sizing: border-box; border-radius: 0 !important; }
  html, body { height: 100%; overflow: hidden; }
  body {
    margin: 0;
    font: 11.5px/1.35 ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
    background: var(--bg); color: var(--text);
    display: grid; grid-template-rows: 28px 1fr;
  }
  a { color: inherit; text-decoration: none; }
  a:hover { text-decoration: underline; }
  .spacer { flex: 1; }
  .dim { color: var(--dim); }
  .faint { color: var(--faint); }
  .grow { flex: 1; min-height: 0; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border-2); }

  header {
    display: flex; align-items: center; gap: 12px; padding: 0 8px;
    background: var(--panel); border-bottom: 1px solid var(--border); white-space: nowrap;
  }
  .brand { font-weight: 700; letter-spacing: 0.12em; }
  .brand span { color: var(--faint); font-weight: 400; }
  .status { display: inline-flex; align-items: center; gap: 5px; color: var(--dim); text-transform: uppercase; letter-spacing: 0.08em; font-size: 10.5px; }
  .status i { width: 6px; height: 6px; background: var(--faint); display: inline-block; }
  .status.running { color: var(--accent); }
  .status.running i { background: var(--accent); animation: blink 1s steps(2, start) infinite; }
  .status.passed { color: var(--ok); }
  .status.passed i { background: var(--ok); }
  .status.failed { color: var(--err); }
  .status.failed i { background: var(--err); }
  @keyframes blink { 50% { opacity: 0; } }
  .metrics { display: flex; gap: 12px; color: var(--faint); font-size: 10.5px; }
  .metrics b { color: var(--dim); font-weight: 400; }
  .ghost {
    font: inherit; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--dim); background: transparent; border: 1px solid transparent; padding: 3px 6px; cursor: pointer;
  }
  .ghost:hover { color: var(--text); border-color: var(--border-2); }

  main { min-height: 0; display: grid; grid-template-columns: minmax(360px, 1fr) minmax(440px, 1.05fr);
         gap: 1px; background: var(--border); }
  .stack { min-height: 0; display: flex; flex-direction: column; gap: 1px; background: var(--border); min-width: 0; }
  .card { background: var(--panel); display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
  .card-h { display: flex; align-items: center; gap: 8px; padding: 3px 6px; border-bottom: 1px solid var(--border); background: var(--panel-2); }
  .card-h h1, .card-h h2 { margin: 0; font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: var(--dim); }
  .card-h .meta { font-size: 10.5px; color: var(--faint); }
  .pill { font-size: 10px; color: var(--dim); border: 1px solid var(--border-2); padding: 0 5px; text-transform: uppercase; letter-spacing: 0.06em; }
  .seg { display: inline-flex; border: 1px solid var(--border-2); }
  .seg button { font: inherit; font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em;
                color: var(--dim); background: transparent; border: 0; border-left: 1px solid var(--border-2); padding: 2px 8px; cursor: pointer; }
  .seg button:first-child { border-left: 0; }
  .seg button.active { background: var(--text); color: var(--bg); font-weight: 700; }

  .screenwrap { flex: 1; min-height: 0; background: #000; display: flex; align-items: center; justify-content: center; position: relative; }
  .screenwrap img { max-width: 100%; max-height: 100%; object-fit: contain; display: none; }
  .screenwrap .noframe { color: var(--faint); font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.1em; }
  .progress { height: 1px; background: var(--border); }
  .progress i { display: block; height: 100%; width: 0; background: var(--text); transition: width 0.2s linear; }
  .nowbar { display: flex; align-items: baseline; gap: 8px; padding: 3px 6px; border-top: 1px solid var(--border);
            white-space: nowrap; overflow: hidden; }
  .nowbar .label { color: var(--faint); font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em; }
  .nowbar b { font-weight: 700; }
  .nowbar .why { color: var(--dim); overflow: hidden; text-overflow: ellipsis; }

  .runform { padding: 6px; display: flex; flex-direction: column; gap: 5px; }
  textarea {
    width: 100%; height: 34px; resize: none; font: inherit; color: var(--text);
    background: var(--bg); border: 1px solid var(--border-2); padding: 4px 5px;
  }
  textarea:focus { outline: none; border-color: var(--text); }
  textarea::placeholder { color: var(--faint); }
  .row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .row .hint { font-size: 10px; color: var(--faint); text-transform: uppercase; letter-spacing: 0.06em; }
  button.primary, button.danger, button.plain {
    font: inherit; font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em;
    padding: 4px 10px; cursor: pointer; border: 1px solid var(--border-2); background: transparent; color: var(--text);
  }
  button.primary { background: var(--text); border-color: var(--text); color: var(--bg); }
  button.primary:hover { background: #fff; }
  button.danger { color: var(--err); border-color: var(--err); }
  button.danger:hover { background: var(--err); color: var(--bg); }
  button:disabled { opacity: 0.35; cursor: default; }
  .presets { display: flex; gap: 4px; flex-wrap: wrap; }
  .presets button {
    font: inherit; font-size: 10px; text-transform: uppercase; letter-spacing: 0.05em;
    color: var(--dim); background: transparent; border: 1px solid var(--border); padding: 2px 6px; cursor: pointer;
  }
  .presets button:hover { color: var(--text); border-color: var(--border-2); }

  .list { max-height: 130px; overflow: auto; }
  .item { display: flex; align-items: center; gap: 8px; padding: 3px 6px; border-top: 1px solid var(--border); }
  .item:first-child { border-top: 0; }
  .item .text { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item .meta { font-size: 10.5px; color: var(--faint); white-space: nowrap; }
  .badge { font-size: 10px; font-weight: 700; letter-spacing: 0.06em; border: 1px solid currentColor; padding: 0 4px; }
  .badge.pass { color: var(--ok); }
  .badge.fail { color: var(--err); }
  .badge.open { color: var(--text); }
  .empty { padding: 6px; color: var(--faint); font-size: 10.5px; }

  .strip { padding: 3px 6px; border-bottom: 1px solid var(--border); background: var(--bg);
           font-size: 10.5px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .strip b { color: var(--text); font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; font-size: 10px; }
  #feed { flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; }
  .ev { padding: 3px 6px; border-top: 1px solid var(--border); }
  .ev:first-child { border-top: 0; }
  .ev .line1 { display: flex; align-items: baseline; gap: 7px; min-width: 0; }
  .ev .idx { color: var(--faint); min-width: 16px; font-variant-numeric: tabular-nums; }
  .ev .act { font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; font-size: 10.5px; }
  .ev .act.click, .ev .act.double_click { color: #7dd3fc; }
  .ev .act.type { color: var(--ok); }
  .ev .act.key { color: #d8b4fe; }
  .ev .act.done { color: var(--ok); }
  .ev .act.blocked, .ev .act.error { color: var(--err); }
  .ev .target { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ev .flag { margin-left: auto; color: var(--faint); white-space: nowrap; font-size: 10px; }
  .ev .sub { color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ev .facts { color: var(--faint); font-size: 10px; display: flex; gap: 10px; font-variant-numeric: tabular-nums; }
  .ev.task { background: var(--panel-2); }
  .ev.task .task-name { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  #runsBody { flex: 1; min-height: 0; overflow: auto; }
  .runrow { display: flex; align-items: center; gap: 8px; padding: 3px 6px; border-top: 1px solid var(--border); cursor: pointer; }
  .runrow:hover { background: var(--panel-2); }
  .runrow .id { color: var(--faint); min-width: 92px; font-variant-numeric: tabular-nums; font-size: 10.5px; }
  .runrow .text { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .runrow .meta { color: var(--faint); white-space: nowrap; font-size: 10.5px; }
  .detail { padding: 6px; }
  .detail h3 { margin: 8px 0 3px; font-size: 10px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--faint); }
  .detail h3:first-child { margin-top: 0; }
  .detail .files a { display: inline-block; color: var(--text); margin: 0 10px 3px 0; text-decoration: underline; }
  .detail .kv { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-bottom: 3px; }
  .steprow { display: flex; gap: 8px; padding: 2px 0; border-bottom: 1px solid var(--border); }
  .steprow .n { color: var(--faint); min-width: 18px; font-variant-numeric: tabular-nums; }
  .steprow .a { font-weight: 700; min-width: 66px; text-transform: uppercase; font-size: 10.5px; }
  .steprow .t { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--dim); }

  #rawOverlay { display: none; position: fixed; inset: 0; z-index: 40; background: var(--panel);
                border: 1px solid var(--border-2); flex-direction: column; overflow: hidden; }
  #rawOverlay.show { display: flex; }
  #rawOverlay .card-h { padding: 3px 6px; }
  #rawOverlay pre { flex: 1; min-height: 0; margin: 0; overflow: auto; padding: 6px; color: var(--dim); white-space: pre-wrap; }
</style>
</head>
<body>
<header>
  <div class="brand">TIVM <span id="verChip">v0.2.0</span></div>
  <div class="status" id="status"><i></i><span id="statusText">idle</span></div>
  <div class="dim" id="taskChip">no task</div>
  <div class="spacer"></div>
  <div class="metrics" id="sysChip"></div>
  <a class="ghost" href="http://localhost:6080/vnc.html?autoconnect=1&resize=scale" target="_blank">desktop</a>
  <a class="ghost" href="/api/result" target="_blank">json</a>
  <button class="ghost" id="rawBtn">log</button>
</header>

<main>
  <div class="stack">
    <article class="card grow">
      <div class="card-h">
        <h1>Sandbox</h1>
        <span class="pill" id="screenInfo">a11y</span>
        <span class="spacer"></span>
        <span class="meta" id="stepChip">step 0</span>
        <span class="meta" id="timeChip">0.0s</span>
        <span class="meta" id="tokenChip">0 tok</span>
      </div>
      <div class="screenwrap"><span class="noframe" id="noFrame">awaiting frame…</span><img id="frame" alt=""></div>
      <div class="progress"><i id="bar"></i></div>
      <div class="nowbar">
        <span class="label">Now</span>
        <b id="nowAction">idle</b>
        <span class="why" id="nowWhy"></span>
      </div>
    </article>

    <article class="card" style="flex:0 0 auto;">
      <div class="runform">
        <textarea id="task" placeholder="one test per line — e.g. Clone https://github.com/owner/repo and show its files"></textarea>
        <div class="row">
          <button class="primary" id="run">Run tests</button>
          <button class="danger" id="stop" disabled>Stop</button>
          <span class="hint">one task per line · ⌘/Ctrl+Enter</span>
        </div>
        <div class="presets">
          <button data-task='Open a terminal and run "uname -a && node -v && bun -v && git --version"'>toolchain</button>
          <button data-task='Open the file manager and open the "Documents" folder'>documents</button>
          <button data-task='Clone https://github.com/maskjelly/whiteye.in and show its files'>clone repo</button>
          <button data-task='Open the Web browser and go to example.com'>browse</button>
        </div>
      </div>
      <div class="card-h" style="border-top:1px solid var(--border); border-bottom:0;">
        <h2>Verdict</h2>
        <span class="spacer"></span>
        <span class="meta" id="summary">waiting…</span>
      </div>
      <div class="list" id="results"></div>
    </article>
  </div>

  <div class="stack">
    <article class="card grow">
      <div class="card-h">
        <h1>Activity</h1>
        <span class="spacer"></span>
        <div class="seg"><button id="tabLive" class="active">current</button><button id="tabRuns">history</button></div>
      </div>
      <div id="liveView" class="grow" style="display:flex; flex-direction:column; min-height:0;">
        <div class="strip" id="planStrip">no plan yet</div>
        <div id="feed"></div>
      </div>
      <div id="runsView" class="grow" style="display:none; flex-direction:column; min-height:0;">
        <div class="strip" id="runsStrip">recent runs</div>
        <div id="runsBody"></div>
      </div>
    </article>
  </div>
</main>

<div id="rawOverlay">
  <div class="card-h"><h1>Raw log</h1><span class="spacer"></span><button class="ghost" id="rawClose">close</button></div>
  <pre id="log"></pre>
</div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = (n) => (n >= 1000 ? (n / 1000).toFixed(1) + 'k' : String(n ?? 0));
const secs = (ms) => (ms >= 1000 ? (ms / 1000).toFixed(1) + 's' : Math.round(ms) + 'ms');
const MAX_VERDICT_ROWS = 5;

let seen = 0;
let tab = 'live';
let token = localStorage.getItem('tivm_token') || '';

async function api(path, body, retry = true) {
  const headers = {};
  if (token) headers['Authorization'] = 'Bearer ' + token;
  if (body) headers['Content-Type'] = 'application/json';
  const res = await fetch(path, body ? {method: 'POST', headers, body: JSON.stringify(body)} : {headers});
  if (res.status === 401 && retry) {
    const t = prompt('Access token (TIVM_TOKEN):');
    if (t) { token = t; localStorage.setItem('tivm_token', t); return api(path, body, false); }
  }
  if (!res.ok) throw new Error(res.status);
  return res.json();
}

function actionClass(a) { return String(a || '').replace(/[^a-z_]/g, ''); }

function eventRow(e) {
  const el = document.createElement('div');
  if (e.kind === 'step') {
    const t = e.timing || {};
    el.className = 'ev';
    el.innerHTML =
      '<div class="line1">' +
        '<span class="idx">' + esc(e.n) + '</span>' +
        '<span class="act ' + esc(actionClass(e.action)) + '">' + esc(e.action) + '</span>' +
        (e.target_text ? '<span class="target">' + esc(e.target_text) + '</span>'
                       : (e.target && e.target !== 'no_text_target' ? '<span class="target">' + esc(e.target) + '</span>' : '')) +
        '<span class="flag">' + (e.changed ? 'changed' : 'no change') + '</span>' +
      '</div>' +
      '<div class="line1"><span class="sub">' +
        (e.typed ? 'typed: ' + esc(e.typed) + ' — ' : '') + (e.reason ? esc(e.reason) : '') +
      '</span></div>' +
      '<div class="facts">' +
        '<span>perceive ' + secs(t.perceive || 0) + '</span>' +
        '<span>decide ' + secs(t.decide || 0) + '</span>' +
        '<span>act ' + secs(t.act || 0) + '</span>' +
        '<span>settle ' + secs(t.settle || 0) + '</span>' +
        (e.tokens && e.tokens.openai ? '<span>' + fmt(e.tokens.openai) + ' tok</span>'
          : e.tokens && e.tokens.ts_in ? '<span>' + fmt(e.tokens.ts_in + e.tokens.ts_out) + ' tok</span>' : '') +
      '</div>';
  } else if (e.kind === 'task_start') {
    el.className = 'ev task';
    el.innerHTML = '<div class="line1"><span class="badge open">RUN</span>' +
      '<span class="task-name">' + esc(e.task) + '</span></div>';
  } else if (e.kind === 'task_end') {
    el.className = 'ev task';
    el.innerHTML = '<div class="line1"><span class="badge ' + (e.passed ? 'pass' : 'fail') + '">' +
      (e.passed ? 'PASS' : 'FAIL') + '</span><span class="task-name">' + esc(e.reason) + '</span>' +
      '<span class="flag">' + esc(e.steps) + ' steps · ' + esc(e.duration_s) + 's</span></div>';
  } else if (e.kind === 'done' || e.kind === 'blocked') {
    el.className = 'ev';
    el.innerHTML = '<div class="line1"><span class="act ' + esc(e.kind) + '">' + esc(e.kind) + '</span>' +
      '<span class="target dim">' + esc(e.reason) + '</span></div>';
  } else if (e.kind === 'error') {
    el.className = 'ev';
    el.innerHTML = '<div class="line1"><span class="act error">error</span><span class="target dim">' + esc(e.message) + '</span></div>';
  } else {
    return null;
  }
  return el;
}

function renderTimeline(timeline) {
  const feed = $('feed');
  if (timeline.length < seen) { feed.innerHTML = ''; seen = 0; }
  for (let i = seen; i < timeline.length; i++) {
    const row = eventRow(timeline[i]);
    if (row) feed.appendChild(row);
  }
  seen = timeline.length;
  let guard = 200;
  while (feed.scrollHeight > feed.clientHeight + 2 && feed.childElementCount > 1 && guard--) {
    feed.removeChild(feed.firstChild);
  }
}

function renderResults(results) {
  const box = $('results');
  if (!results.length) { box.innerHTML = '<div class="empty">no results yet</div>'; return; }
  const shown = results.slice(-MAX_VERDICT_ROWS);
  box.innerHTML = (results.length > shown.length ? '<div class="empty">+' + (results.length - shown.length) + ' earlier</div>' : '') +
    shown.map((r) =>
      '<div class="item"><span class="badge ' + (r.passed ? 'pass' : 'fail') + '">' + (r.passed ? 'PASS' : 'FAIL') + '</span>' +
      '<span class="text">' + esc(r.task) + '</span>' +
      '<span class="meta">' + esc(r.steps) + ' st · ' + esc(r.duration_s ?? '?') + 's</span></div>').join('');
}

function render(s) {
  const st = $('status');
  const mode = s.error ? 'failed' : s.running ? 'running' : s.passed === true ? 'passed' : s.passed === false ? 'failed' : '';
  st.className = 'status' + (mode ? ' ' + mode : '');
  $('statusText').textContent = mode === 'running' ? 'running' : mode === 'passed' ? 'passed' : mode === 'failed' ? 'failed' : 'idle';
  $('taskChip').textContent = s.tasks.length
    ? 'task ' + Math.max(1, Math.min(s.task_index, s.tasks.length)) + '/' + s.tasks.length
    : 'no task';
  const cur = s.current || {};
  const secsTotal = s.finished_at && s.started_at ? (s.finished_at - s.started_at) : s.started_at ? (Date.now() / 1000 - s.started_at) : 0;
  $('stepChip').textContent = 'step ' + (cur.n || 0) + (s.max_steps ? '/' + s.max_steps : '');
  $('timeChip').textContent = secsTotal.toFixed(1) + 's';
  $('tokenChip').textContent = fmt(s.tokens.input + s.tokens.output) + 'j ' + fmt(s.openai_tokens) + 'o';
  if (s.frame) { $('frame').src = s.frame; $('frame').style.display = 'block'; $('noFrame').style.display = 'none'; }
  $('screenInfo').textContent = s.planner_model;
  $('nowAction').textContent = cur.action
    ? cur.action + (cur.target_text ? ' → ' + cur.target_text : '')
    : (s.running ? 'thinking' : 'idle');
  $('nowWhy').textContent = cur.reason || '';
  $('bar').style.width = s.max_steps ? Math.min(100, ((cur.n || 0) / s.max_steps) * 100) + '%' : (s.running ? '100%' : '0%');
  $('run').disabled = s.running;
  $('stop').disabled = !s.running;
  renderTimeline(s.timeline || []);
  renderResults(s.results || []);
  $('summary').textContent = s.results.length
    ? s.results.filter((r) => r.passed).length + '/' + s.results.length + ' pass' + (s.running ? '…' : '')
    : 'waiting…';
  const plan = s.plan || [], mem = s.memory || '';
  $('planStrip').innerHTML = plan.length
    ? '<b>plan</b> ' + plan.map(esc).join(' → ') + (mem ? '  ·  <b>mem</b> ' + esc(mem) : '')
    : 'no plan';
  const text = (s.log || []).join('\n');
  if ($('log').textContent !== text) { $('log').textContent = text; $('log').scrollTop = $('log').scrollHeight; }
}

async function renderSystem() {
  try {
    const y = await api('/api/system');
    $('verChip').textContent = 'v' + y.version;
    $('sysChip').innerHTML = '<span>disk <b>' + y.disk_used_gb + '/' + y.disk_total_gb + 'G</b></span>' +
      '<span>mem <b>' + y.mem_free_mb + 'M</b></span><span>load <b>' + y.load[0] + '</b></span>';
  } catch (e) {}
}

async function renderRuns() {
  const body = $('runsBody');
  try {
    const data = await api('/api/runs');
    $('runsStrip').innerHTML = '<b>' + data.runs.length + '</b> runs';
    if (!data.runs.length) {
      body.innerHTML = '<div class="empty">no runs on disk</div>';
      return;
    }
    body.innerHTML = data.runs.map((r) =>
      '<div class="runrow" data-id="' + esc(r.id) + '">' +
        '<span class="badge ' + (r.passed ? 'pass' : 'fail') + '">' + (r.passed ? 'PASS' : 'FAIL') + '</span>' +
        '<span class="id">' + esc(r.id) + '</span>' +
        '<span class="text">' + esc((r.tasks[0] || {}).task || '') + (r.tasks.length > 1 ? ' +' + (r.tasks.length - 1) : '') + '</span>' +
        '<span class="meta">' + esc(r.duration_s ?? '?') + 's ' + fmt((r.tokens && (r.tokens.input + r.tokens.output)) + (r.openai_tokens || 0)) + 't</span>' +
      '</div>').join('');
    body.querySelectorAll('.runrow').forEach((el) => el.onclick = () => showRun(el.dataset.id));
  } catch (e) {}
}

async function showRun(id) {
  const body = $('runsBody');
  body.innerHTML = '<div class="empty">loading ' + esc(id) + '</div>';
  try {
    const d = await api('/api/runs/' + id);
    const s = d.summary || {};
    const tasks = (s.tasks || []).map((t) =>
      '<div class="item"><span class="badge ' + (t.passed ? 'pass' : 'fail') + '">' + (t.passed ? 'PASS' : 'FAIL') + '</span>' +
      '<span class="text">' + esc(t.task) + '</span><span class="meta">' + esc(t.steps) + ' steps ' + esc(t.duration_s ?? '?') + 's</span></div>').join('');
    const files = (d.files || []).map((f) => '<a href="' + esc(f.url) + '" target="_blank">' + esc(f.name) + '</a>').join('');
    const steps = (d.timeline || []).filter((t) => t.kind === 'step').map((t) =>
      '<div class="steprow"><span class="n">' + esc(t.n) + '</span><span class="a">' + esc(t.action) + '</span>' +
      '<span class="t">' + esc((t.reason || t.target_text || '').slice(0, 90)) + '</span></div>').join('');
    body.innerHTML =
      '<div class="detail">' +
        '<div class="kv"><button class="plain" id="runsBack">back</button>' +
        '<span class="badge ' + (s.passed ? 'pass' : 'fail') + '">' + (s.passed ? 'PASS' : 'FAIL') + '</span>' +
        '<span class="meta dim">' + esc(s.duration_s ?? '?') + 's · ' + fmt((s.tokens && (s.tokens.input + s.tokens.output)) || 0) + 'j ' + fmt(s.openai_tokens) + 'o</span></div>' +
        '<h3>tasks</h3>' + tasks +
        '<h3>artifacts</h3><div class="files">' + files + '</div>' +
        '<h3>steps</h3>' + steps +
      '</div>';
    $('runsBack').onclick = () => renderRuns();
  } catch (e) {
    body.innerHTML = '<div class="empty">could not load ' + esc(id) + '</div>';
  }
}

function setTab(next) {
  tab = next;
  $('tabLive').className = next === 'live' ? 'active' : '';
  $('tabRuns').className = next === 'runs' ? 'active' : '';
  $('liveView').style.display = next === 'live' ? 'flex' : 'none';
  $('runsView').style.display = next === 'runs' ? 'flex' : 'none';
  if (next === 'runs') renderRuns();
}

async function tick() {
  try { render(await api('/api/state')); } catch (e) {}
  if (tab === 'runs') renderRuns();
  setTimeout(tick, 1200);
}

$('run').onclick = async () => {
  const tasks = $('task').value.split('\n').map((t) => t.trim()).filter(Boolean);
  if (!tasks.length) { $('task').focus(); return; }
  seen = 0; $('feed').innerHTML = '';
  try { await api('/api/run', {tasks}); } catch (e) {}
};
$('stop').onclick = () => api('/api/stop', {}).catch(() => {});
$('task').addEventListener('keydown', (e) => { if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) $('run').click(); });
document.querySelectorAll('.presets button').forEach((b) => b.onclick = () => { $('task').value = b.dataset.task; $('task').focus(); });
$('rawBtn').onclick = () => $('rawOverlay').classList.add('show');
$('rawClose').onclick = () => $('rawOverlay').classList.remove('show');
$('tabLive').onclick = () => setTab('live');
$('tabRuns').onclick = () => setTab('runs');

renderSystem();
setInterval(renderSystem, 5000);
if (location.hash === '#runs') setTab('runs');
tick();
</script>
</body>
</html>
